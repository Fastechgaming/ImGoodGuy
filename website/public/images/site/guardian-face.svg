<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 130">
  <defs>
    <linearGradient id="stoneFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcc192"/>
      <stop offset="100%" stop-color="#a8783f"/>
    </linearGradient>
  </defs>
  <g stroke="#5c3d1f" stroke-width="2.5" stroke-linejoin="round">
    <!-- headdress tiers -->
    <path d="M50,4 L62,22 L38,22 Z" fill="url(#stoneFace)"/>
    <rect x="30" y="20" width="40" height="10" rx="3" fill="url(#stoneFace)"/>
    <!-- face -->
    <path d="M28,34 Q28,90 50,110 Q72,90 72,34 Q72,24 50,22 Q28,24 28,34 Z" fill="url(#stoneFace)"/>
    <!-- ears -->
    <ellipse cx="26" cy="55" rx="6" ry="12" fill="url(#stoneFace)"/>
    <ellipse cx="74" cy="55" rx="6" ry="12" fill="url(#stoneFace)"/>
  </g>
  <g stroke="#5c3d1f" stroke-width="2.2" stroke-linecap="round" fill="none">
    <!-- closed serene eyes -->
    <path d="M35,52 Q41,47 47,52"/>
    <path d="M53,52 Q59,47 65,52"/>
    <!-- eyebrows -->
    <path d="M34,45 Q41,40 48,45"/>
    <path d="M52,45 Q59,40 66,45"/>
    <!-- nose -->
    <path d="M50,54 L47,68 Q50,71 53,68 Z" fill="#c79a5e" stroke="#5c3d1f" stroke-width="1.6"/>
    <!-- gentle smile -->
    <path d="M38,78 Q50,90 62,78" stroke-width="2.6"/>
  </g>
</svg>
