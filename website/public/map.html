<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Map — AngkorSMP</title>
<meta name="description" content="Explore the AngkorSMP Minecraft world in real time with the live BlueMap — see builds, terrain, and the Khmer-inspired landscape as players are shaping it." />
<link rel="canonical" href="https://www.angkorsmp.com/map" />
<meta name="theme-color" content="#f7b537" />
<link rel="icon" href="/images/site/logo-icon.png" />
<link rel="apple-touch-icon" href="/images/site/logo-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="AngkorSMP" />
<meta property="og:url" content="https://www.angkorsmp.com/map" />
<meta property="og:title" content="Live Map — AngkorSMP" />
<meta property="og:description" content="Explore the AngkorSMP Minecraft world in real time with the live BlueMap." />
<meta property="og:image" content="https://www.angkorsmp.com/images/site/og-cover.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Live Map — AngkorSMP" />
<meta name="twitter:description" content="Explore the AngkorSMP Minecraft world in real time with the live BlueMap." />
<meta name="twitter:image" content="https://www.angkorsmp.com/images/site/og-cover.png" />

<link rel="stylesheet" href="/css/style.css" />
<script>
// Apply the saved theme before first paint so there's no flash. Dark is default.
try { if (localStorage.getItem("angkorsmp-theme") === "light") document.documentElement.setAttribute("data-theme","light"); } catch (e) {}
</script>
</head>
<body>
  <nav class="site-nav">
    <div class="nav-vine" aria-hidden="true"></div>
    <div class="container">
      <a class="brand" href="/">
        <img id="nav-logo" src="/images/site/logo-icon.png" alt="logo" onerror="this.style.display='none'" />
        AngkorSMP
      </a>
      <div class="nav-tools">
        <div class="lang-dropdown">
          <button type="button" class="lang-toggle" onclick="toggleLangMenu()" aria-haspopup="true" aria-expanded="false" aria-label="Language">
            <span class="lang-current">EN</span>
          </button>
          <ul class="lang-menu" role="menu">
            <li role="none"><button type="button" role="menuitem" class="lang-option" data-lang="en" onclick="setLang('en')">English</button></li>
            <li role="none"><button type="button" role="menuitem" class="lang-option" data-lang="km" onclick="setLang('km')">ខ្មែរ</button></li>
          </ul>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Switch theme">☀️</button>
      </div>
      <ul class="nav-links">
        <li><a href="/" data-i18n="nav.home">🏠 Home</a></li>
        <li><a href="/games" data-i18n="nav.games">🎮 Games</a></li>
        <li><a href="/store" data-i18n="nav.store">💰 Store</a></li>
        <li><a href="/map" class="active" data-i18n="nav.map">🗺️ Map</a></li>
      </ul>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu" data-i18n-aria="nav.menu">&#9776;</button>
    </div>
  </nav>
  <div class="khmer-strip" aria-hidden="true"></div>

  <main class="map-wrap">
    <div class="container">
      <h2 class="no-rule" data-i18n="map.title">🌿 Cambodia Map 🌿</h2>
      <p class="section-subtitle" data-i18n="map.subtitle">LIVE MAP</p>
      <p class="map-age" id="map-age-text"></p>
      <p style="text-align:center; color: var(--ink-soft); margin-top:-0.5rem;">
        <span data-i18n="map.explain">Explore AngkorSMP in real time. Having trouble viewing it below?</span>
        <a id="map-open-link" href="#" target="_blank" rel="noopener" data-i18n="map.openNew">Open the map in a new tab ↗</a>
      </p>
      <div class="map-frame-holder" id="map-frame-holder">
        <div class="map-fallback" id="map-fallback">
          <p data-i18n="map.fallback">The live map couldn't be embedded here.</p>
          <a href="#" id="map-open-link-2" target="_blank" rel="noopener" data-i18n="map.openBluemap">Open BlueMap in a new tab</a>
        </div>
      </div>
    </div>
  </main>

  <div class="khmer-strip" aria-hidden="true"></div>
  <footer class="site-footer">
    <p id="footer-copy" data-i18n="footer.copy"></p>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/map.js"></script>
</body>
</html>
