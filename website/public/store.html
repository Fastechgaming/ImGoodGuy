<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Store — AngkorSMP</title>
<link rel="icon" href="/images/site/logo-icon.png" />
<link rel="stylesheet" href="/css/style.css" />
<script>
// Apply the saved theme before first paint so there's no flash. Dark is default.
try { if (localStorage.getItem("angkorsmp-theme") === "light") document.documentElement.setAttribute("data-theme","light"); } catch (e) {}
</script>
</head>
<body>
  <nav class="site-nav">
    <div class="nav-vine" aria-hidden="true"></div>
    <div class="container">
      <a class="brand" href="/">
        <img id="nav-logo" src="/images/site/logo-icon.png" alt="logo" onerror="this.style.display='none'" />
        AngkorSMP
      </a>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="Switch theme">☀️</button>
      <ul class="nav-links">
        <li><a href="/">🏠 Home</a></li>
        <li><a href="/games.html">🎮 Games</a></li>
        <li><a href="/store.html" class="active">💰 Store</a></li>
        <li><a href="/map.html">🗺️ Map</a></li>
      </ul>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu">&#9776;</button>
    </div>
  </nav>
  <div class="khmer-strip" aria-hidden="true"></div>

  <main>
    <section class="section">
      <div class="container">
        <h2 class="no-rule">🌿 AngkorSMP 🌿</h2>
        <p class="section-subtitle">STORE</p>
        <div class="store-tabs" id="store-tabs"></div>
        <div class="item-grid" id="item-grid"></div>
      </div>
    </section>
  </main>

  <div class="khmer-strip" aria-hidden="true"></div>
  <footer class="site-footer">
    <p>&copy; <span id="year"></span> AngkorSMP &middot; Cambodia Minecraft Server 🇰🇭</p>
  </footer>

  <!-- Info ("!") modal -->
  <div class="modal-overlay" id="info-modal">
    <div class="modal-box wide">
      <button class="modal-close" id="info-modal-close">&times;</button>
      <div id="info-modal-body"></div>
    </div>
  </div>

  <!-- Buy flow modal -->
  <div class="modal-overlay" id="buy-modal">
    <div class="modal-box">
      <button class="modal-close" id="buy-modal-close">&times;</button>
      <div id="buy-modal-body"></div>
    </div>
  </div>

  <script src="/js/playername.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/store.js"></script>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
