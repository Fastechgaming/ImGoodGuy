<link rel="icon" href="/images/site/logo-icon.png" />
<link rel="apple-touch-icon" href="/images/site/logo-icon.png" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="AngkorSMP" />
<meta property="og:url" content="https://www.angkorsmp.com/banned" />

<meta property="og:description" content="See who is currently banned from the AngkorSMP Minecraft server." />

<link rel="stylesheet" href="/css/style.css" />
<script>
// Apply the saved theme before first paint so there's no flash. Dark is default.
try { if (localStorage.getItem("angkorsmp-theme") === "light") document.documentElement.setAttribute("data-theme","light"); } catch (e) {}
</script>
</head>
<body>
  <nav class="site-nav">
    <div class="nav-vine" aria-hidden="true"></div>
    <div class="container">
      <a class="brand" href="/">
        <img id="nav-logo" src="/images/site/logo-icon.png" alt="logo" onerror="this.style.display='none'" />
        AngkorSMP
      </a>
      <div class="nav-tools">
        <div class="lang-dropdown">
          <button type="button" class="lang-toggle" onclick="toggleLangMenu()" aria-haspopup="true" aria-expanded="false" aria-label="Language">
            <span class="lang-current">EN</span>
          </button>
          <ul class="lang-menu" role="menu">
            <li role="none"><button type="button" role="menuitem" class="lang-option" data-lang="en" onclick="setLang('en')">English</button></li>
            <li role="none"><button type="button" role="menuitem" class="lang-option" data-lang="km" onclick="setLang('km')">ខ្មែរ</button></li>
          </ul>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Switch theme">☀️</button>
      </div>
      <ul class="nav-links">
        <li><a href="/" data-i18n="nav.home">🏠 Home</a></li>
        <li><a href="/games" data-i18n="nav.games">🎮 Games</a></li>
        <li><a href="/store" data-i18n="nav.store">💰 Store</a></li>
        <li><a href="/map" data-i18n="nav.map">🗺️ Map</a></li>
        <li><a href="/banned" class="active" data-i18n="nav.banned">🚫 Banned</a></li>
      </ul>
      <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu" data-i18n-aria="nav.menu">&#9776;</button>
    </div>
  </nav>
  <div class="khmer-strip" aria-hidden="true"></div>

  <main>
    <section class="section">
      <div class="container">
        <h2 class="no-rule" data-i18n="banned.title">🌿 Banned Players 🌿</h2>
        <p class="section-subtitle" data-i18n="banned.subtitle">BANNED</p>
        <p class="checkout-hint centered" data-i18n="banned.hint">Currently banned players, most recent first.</p>

        <div class="coin-unavailable-banner" id="banned-unavailable" hidden>
          <span data-i18n="banned.unavailable">⚠️ The banned players list is unavailable right now. Contact support for more info.</span>
        </div>

        <div class="board-table-wrap">
          <table class="board-table banned-table">
            <thead>
              <tr>
                <th data-i18n="banned.colPlayer">Player</th>
                <th data-i18n="banned.colReason">Reason</th>
                <th data-i18n="banned.colBannedBy">Banned By</th>
                <th data-i18n="banned.colDate">Date</th>
                <th data-i18n="banned.colExpires">Expires</th>
              </tr>
            </thead>
            <tbody id="banned-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div class="khmer-strip" aria-hidden="true"></div>
  <footer class="site-footer">
    <p id="footer-copy" data-i18n="footer.copy"></p>
  </footer>

  <script src="/js/i18n.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/banned.js"></script>
</body>
</html>
