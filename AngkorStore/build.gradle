plugins {
    id "java"
    // Only needed for hooks.LiteBansHook's SQLite JDBC driver (see the
    // dependency and shadowJar block below) - everything else here still
    // relies on the server/soft-depended plugins to provide its classes.
    id "com.gradleup.shadow" version "8.3.5"
}

group = "com.angkorsmp"
version = "1.0.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo.papermc.io/repository/maven-public/" }
    maven { url "https://jitpack.io" }                         // VaultAPI
    maven { url "https://repo.lucko.me/" }                     // LuckPerms
}

dependencies {
    // Everything below is provided at runtime by the server itself, or by
    // the soft-depended plugin it belongs to — never shaded into the jar.
    // (No Floodgate API dependency: Bedrock support only needs the
    // "username-prefix" character, which is read from this plugin's own
    // config.yml instead of Floodgate's internals - see player.bedrock-prefix.)
    compileOnly "io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT"
    compileOnly "net.luckperms:api:5.4"
    // VaultAPI's own POM drags in an ancient org.bukkit:bukkit stub, which
    // Gradle's capability resolution then refuses to pick between and
    // paper-api (both claim to provide "org.bukkit:bukkit"). We only want
    // VaultAPI's economy interfaces, not its transitive Bukkit, so drop it.
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
    }
    // Paper ships Gson on the runtime classpath already (it uses it
    // internally, and it's visible to plugins unshaded) - compileOnly here
    // just gives us the types to code against. If your server setup somehow
    // doesn't expose it, add the Shadow plugin and shade+relocate this one
    // dependency; nothing else here needs it.
    compileOnly "com.google.code.gson:gson:2.11.0"

    // The one real exception to "never shaded": LiteBans has no runtime
    // Java API for listing punishments, so hooks.LiteBansHook reads its
    // SQLite database directly - and unlike LuckPerms/Vault's APIs, no
    // installed plugin puts a SQLite JDBC driver on this server's
    // classpath. Shaded and relocated below so it can't clash with any
    // other plugin bundling its own copy of the same driver.
    implementation "org.xerial:sqlite-jdbc:3.46.1.3"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named("processResources") {
    filesMatching("plugin.yml") {
        expand(version: project.version)
    }
}

tasks.named("jar") {
    archiveBaseName = "AngkorStore"
    archiveVersion = project.version
}

// The Shadow plugin wires shadowJar into the normal "build"/"assemble"
// lifecycle automatically, so plain `./gradlew build` keeps working exactly
// as before - it now just also produces this shaded jar, at the same
// build/libs/AngkorStore-1.0.0.jar path (empty classifier below overwrites
// the plain jar output there), so there's only ever one jar to deploy and
// no risk of accidentally shipping the one missing the SQLite driver.
tasks.named("shadowJar") {
    archiveBaseName = "AngkorStore"
    archiveVersion = project.version
    archiveClassifier = ""
    relocate "org.sqlite", "com.angkorsmp.angkorstore.libs.sqlite"
}
