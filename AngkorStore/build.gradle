plugins {
    id "java"
    // Only needed for hooks.LiteBansHook's SQLite JDBC driver (see the
    // dependency and shadowJar block below) - everything else here still
    // relies on the server/soft-depended plugins to provide its classes.
    id "com.gradleup.shadow" version "8.3.5"
}

group = "com.angkorsmp"
version = "1.0.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo.papermc.io/repository/maven-public/" }
    maven { url "https://jitpack.io" }                         // VaultAPI
    maven { url "https://repo.lucko.me/" }                     // LuckPerms
}

dependencies {
    // Everything below is provided at runtime by the server itself, or by
    // the soft-depended plugin it belongs to — never shaded into the jar.
    // (No Floodgate API dependency: Bedrock support only needs the
    // "username-prefix" character, which is read from this plugin's own
    // config.yml instead of Floodgate's internals - see player.bedrock-prefix.)
    compileOnly "io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT"
    compileOnly "net.luckperms:api:5.4"
    // VaultAPI's own POM drags in an ancient org.bukkit:bukkit stub, which
    // Gradle's capability resolution then refuses to pick between and
    // paper-api (both claim to provide "org.bukkit:bukkit"). We only want
    // VaultAPI's economy interfaces, not its transitive Bukkit, so drop it.
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
    }
    // Paper ships Gson on the runtime classpath already (it uses it
    // internally, and it's visible to plugins unshaded) - compileOnly here
    // just gives us the types to code against. If your server setup somehow
    // doesn't expose it, add the Shadow plugin and shade+relocate this one
    // dependency; nothing else here needs it.
    compileOnly "com.google.code.gson:gson:2.11.0"

    // The one real exception to "never shaded": LiteBans has no runtime
    // Java API for listing punishments, so hooks.LiteBansHook reads its
    // database directly - and unlike LuckPerms/Vault's APIs, no installed
    // plugin puts either of these drivers on this server's classpath.
    // Both are shaded and relocated below so neither clashes with another
    // plugin (LiteBans included) bundling its own copy of the same driver.
    // Both are needed since LiteBans' storage format changed at some point
    // (see hooks.LiteBansHook's own doc comment) - SQLite for an older
    // install, H2 for LiteBans' current default.
    implementation "org.xerial:sqlite-jdbc:3.46.1.3"
    implementation "com.h2database:h2:2.3.232"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named("processResources") {
    filesMatching("plugin.yml") {
        expand(version: project.version)
    }
}

tasks.named("jar") {
    archiveBaseName = "AngkorStore"
    archiveVersion = project.version
}

// com.gradleup.shadow does NOT wire shadowJar into "build"/"assemble" on its
// own (verified empirically: `gradle build --dry-run` never lists :shadowJar
// unless this is added) - so without the dependsOn below, plain
// `./gradlew build` silently produces only the unshaded jar, missing the
// SQLite/H2 driver hooks.LiteBansHook needs, with no error or warning
// anywhere. This also gives shadowJar its own filename rather than sharing
// the plain jar task's: they don't depend on each other, so two tasks
// racing to write the same path is its own separate way to end up with the
// unshaded jar depending on which one happened to finish last (also
// verified empirically - reproduces on every run, not just occasionally).
tasks.named("shadowJar") {
    archiveBaseName = "AngkorStore"
    archiveVersion = project.version
    archiveClassifier = "all"
    relocate "org.sqlite", "com.angkorsmp.angkorstore.libs.sqlite"
    relocate "org.h2", "com.angkorsmp.angkorstore.libs.h2"
}

tasks.named("assemble") {
    dependsOn tasks.named("shadowJar")
}
